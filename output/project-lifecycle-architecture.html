    {cls:'entry', x:30,y:30,w:370,h:1145,title:'01 · 入口与风险路由',note:'用户意图先被分类，再进入最短可行流程'},
    {cls:'package', x:420,y:30,w:680,h:1145,title:'02 · Skill 包（可复用）',note:'入口规则保持短小，参考资料按阶段按需加载'},
    {cls:'project', x:1080,y:30,w:610,h:780,title:'03 · 目标项目事实源',note:'状态、规则、规格和验证留在真实项目仓库'},
    {cls:'flow', x:420,y:865,w:1270,h:300,title:'04 · 生命周期主线',note:'只有已批准的上游工件才能跨过下一道门槛'}
  ];
  var palette = {entry:'#45d6d1',package:'#a88cff',reference:'#74a9ff',runtime:'#f08b9c',script:'#67d49a',artifact:'#f3b65c',guard:'#ef737e'};
  var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
  var selected = null, query = '', activeGroups = new Set(Object.keys(palette)), scale = 1;
  var graph = document.getElementById('graph'), zonesEl = document.getElementById('zones'), edgesEl = document.getElementById('edges'), nodesEl = document.getElementById('nodes'), panel = document.getElementById('panel');
  var ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) { var item = document.createElementNS(ns, tag); Object.keys(attrs || {}).forEach(function (key) { item.setAttribute(key, attrs[key]); }); if (parent) parent.appendChild(item); return item; }
  function text(parent, x, y, value, cls, anchor) { var t = el('text', {x:x,y:y,class:cls || '', 'text-anchor':anchor || 'start'}, parent); t.textContent = value; return t; }
  function renderZones() { zonesEl.innerHTML = ''; zones.forEach(function (z) { el('rect', {x:z.x,y:z.y,width:z.w,height:z.h,rx:8,class:'zone '+z.cls}, zonesEl); text(zonesEl,z.x+18,z.y+27,z.title,'zone-title'); text(zonesEl,z.x+18,z.y+48,z.note,'zone-note'); }); }
  function edgePath(a,b) { var ax=a.x+a.w/2, ay=a.y+a.h/2, bx=b.x+b.w/2, by=b.y+b.h/2; var dx=bx-ax, dy=by-ay; if (Math.abs(dx) > Math.abs(dy)) { ax += dx>0 ? a.w/2 : -a.w/2; bx += dx>0 ? -b.w/2 : b.w/2; } else { ay += dy>0 ? a.h/2 : -a.h/2; by += dy>0 ? -b.h/2 : b.h/2; } var bend = Math.max(34, Math.min(120, Math.abs(dx+dy)*.12)); if (Math.abs(dx) > Math.abs(dy)) return 'M '+ax+' '+ay+' C '+(ax+(bx-ax)/2)+' '+ay+', '+(bx-(bx-ax)/2)+' '+by+', '+bx+' '+by; return 'M '+ax+' '+ay+' C '+ax+' '+(ay+(by-ay)/2)+', '+bx+' '+(by-(by-ay)/2)+', '+bx+' '+by; }
  function renderEdges() { edgesEl.innerHTML = ''; edges.forEach(function (e, i) { var a=byId[e[0]], b=byId[e[1]], p=el('path',{d:edgePath(a,b),class:'edge '+e[3], 'data-edge':i},edgesEl); p.setAttribute('data-from',e[0]); p.setAttribute('data-to',e[1]); var mx=(a.x+a.w/2+b.x+b.w/2)/2, my=(a.y+a.h/2+b.y+b.h/2)/2; if (Math.abs(a.x-b.x)<500 || Math.abs(a.y-b.y)<250) text(edgesEl,mx,my-5,e[2],'edge-label'); }); }
  function renderNodes() { nodesEl.innerHTML = ''; nodes.forEach(function (n) { var g=el('g',{class:'node', tabindex:'0', role:'button', 'aria-label':n.label+'，'+n.purpose, 'data-id':n.id},nodesEl); el('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:7},g); el('circle',{cx:n.x+18,cy:n.y+21,r:5,class:'dot '+n.group},g); text(g,n.x+32,n.y+26,n.label,'label'); if(n.sub) text(g,n.x+18,n.y+50,n.sub,'sub'); g.addEventListener('click',function(){selectNode(n.id);}); g.addEventListener('keydown',function(evt){if(evt.key==='Enter'||evt.key===' '){evt.preventDefault();selectNode(n.id);}}); }); }
  function relatedIds(id) { var set = new Set([id]); edges.forEach(function(e){if(e[0]===id)set.add(e[1]); if(e[1]===id)set.add(e[0]);}); return set; }
  function matches(n) { if(!activeGroups.has(n.group)) return false; if(!query) return true; var hay=(n.label+' '+(n.sub||'')+' '+(n.path||'')+' '+n.purpose).toLowerCase(); return hay.indexOf(query.toLowerCase())>=0; }
  function applyState() { var related=selected?relatedIds(selected):new Set(); document.querySelectorAll('.node').forEach(function(g){var n=byId[g.getAttribute('data-id')]; g.classList.toggle('selected',n.id===selected); g.classList.toggle('connected',selected && related.has(n.id) && n.id!==selected); g.classList.toggle('dim',!matches(n) || (selected && !related.has(n.id)));}); document.querySelectorAll('.edge').forEach(function(p){var a=p.getAttribute('data-from'),b=p.getAttribute('data-to'); var active=selected && (a===selected||b===selected); p.classList.toggle('active',!!active); p.classList.toggle('dim',!!selected && !active);}); }
  function selectNode(id) { selected = id; renderPanel(); applyState(); }
  function clearSelection() { selected=null; renderPanel(); applyState(); }
  function linked(id) { var list=[]; edges.forEach(function(e){if(e[0]===id)list.push({id:e[1],kind:'out'}); if(e[1]===id)list.push({id:e[0],kind:'in'});}); return list; }
  function renderPanel() { if(!selected){ var names={entry:'入口',package:'Skill 包',reference:'参考',runtime:'流程',script:'脚本',artifact:'项目资料',guard:'边界'}; var filters=Object.keys(palette).map(function(k){return '<button class="filter" type="button" data-filter="'+k+'" aria-pressed="'+activeGroups.has(k)+'" title="切换'+names[k]+'层">'+names[k]+'</button>';}).join(''); panel.innerHTML='<div class="panel-kicker">Architecture overview</div><h2>Project Lifecycle</h2><p class="panel-copy">把一次开发工作拆成可恢复的事实链：入口识别风险，Skill 按需加载规则与参考，项目仓库保存状态和证据。</p><div class="panel-section"><h3>事实边界</h3><ul><li>Skill 包：通用规则、参考文档、确定性脚本</li><li>目标项目：.agent/ 里的规则、规格、工作项、记忆和验证</li><li>源码 / 测试 / Git：各自领域的最终事实源</li></ul></div><div class="panel-section"><h3>层级筛选</h3><div class="filter-row">'+filters+'</div></div>'; panel.querySelectorAll('[data-filter]').forEach(function(b){b.addEventListener('click',function(){var key=b.getAttribute('data-filter'); if(activeGroups.has(key)){if(activeGroups.size===1)return; activeGroups.delete(key);}else activeGroups.add(key); renderPanel(); applyState();});}); return; } var n=byId[selected], links=linked(selected); var incoming=links.filter(function(x){return x.kind==='in';}), outgoing=links.filter(function(x){return x.kind==='out';}); var list=function(items){return items.length?'<ul>'+items.map(function(x){return '<li><button type="button" data-jump="'+x.id+'">'+byId[x.id].label+'</button></li>';}).join('')+'</ul>':'<p class="empty">无直接关系</p>';}; panel.innerHTML='<div class="panel-kicker">'+n.group+'</div><h2>'+n.label+'</h2>'+(n.path?'<p class="panel-path">'+n.path+'</p>':'')+'<span class="tag">'+(n.sub||'架构节点')+'</span><p class="panel-copy">'+n.purpose+'</p><div class="panel-section"><h3>进入此节点</h3>'+list(incoming)+'</div><div class="panel-section"><h3>从此节点出去</h3>'+list(outgoing)+'</div>'; panel.querySelectorAll('[data-jump]').forEach(function(b){b.addEventListener('click',function(){selectNode(b.getAttribute('data-jump'));});}); }
  function renderMetrics() { var counts={}; nodes.forEach(function(n){counts[n.group]=(counts[n.group]||0)+1;}); document.getElementById('metrics').innerHTML='<div class="metric"><strong>'+nodes.length+'</strong><span>节点</span></div><div class="metric"><strong>'+edges.length+'</strong><span>关系</span></div><div class="metric"><strong>'+counts.reference+'</strong><span>参考文档</span></div><div class="metric"><strong>'+counts.script+'</strong><span>确定性脚本</span></div>'; }
  function renderLegend() { document.getElementById('legend').innerHTML=Object.keys(palette).map(function(k){var names={entry:'入口',package:'Skill 包',reference:'参考',runtime:'流程',script:'脚本',artifact:'项目资料',guard:'边界'};return '<span class="legend-item"><i class="'+k+'"></i>'+names[k]+'</span>';}).join(''); }
  function setZoom(next) { scale=Math.max(.72,Math.min(1.35,next)); graph.style.transform='scale('+scale+')'; graph.style.width=(1720*scale)+'px'; graph.style.height=(1220*scale)+'px'; }
  document.getElementById('search').addEventListener('input',function(e){query=e.target.value.trim();applyState();});
  document.getElementById('zoomIn').addEventListener('click',function(){setZoom(scale+.1);}); document.getElementById('zoomOut').addEventListener('click',function(){setZoom(scale-.1);}); document.getElementById('zoomReset').addEventListener('click',function(){setZoom(1);}); document.getElementById('clear').addEventListener('click',clearSelection);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')clearSelection(); if(e.key==='/' && document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('search').focus();}});
  renderZones(); renderEdges(); renderNodes(); renderMetrics(); renderLegend(); renderPanel(); applyState(); setZoom(1);
})();
</script>
