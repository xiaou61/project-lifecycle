# mypy config (shared by CI and local)
# Type-checks only the core status engine scripts/project_status.py -- it is the
# public data contract consumed by the desktop viewer (see wiki/D-007).
# artifacts.py / project_validate.py still use dict[str, object] style and are a
# follow-up typing task, so they are not gated yet.
[mypy]
ignore_missing_imports = True
warn_unused_ignores = True
# project_status.py 从同目录的 status_schema.py / status_parsing.py 导入，
# 固定搜索路径，保证从仓库根运行时也能解析同级模块。
mypy_path = skills/project-lifecycle/scripts
