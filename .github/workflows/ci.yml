name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 3.9 是命令适配器声明的版本下限，固定它防止再次引入 3.10+ 写法
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Compile scripts
        run: python -m compileall -q skills/project-lifecycle/scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build documentation site
        run: npm run docs:build

  desktop:
    # 只做类型检查和编译：不下载 Electron 二进制（--ignore-scripts），
    # 因为这里要挡的是 TypeScript 编译错误，界面验证由 desktop/README.md 的 smoke 自检负责。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Typecheck and build
        run: npm run build
